; Strict typing for the transport module (port prep for ha-nanit, whose CI
; runs mypy --strict). Only api.py and const.py are held to strict: they are
; what ports over. The HA-facing modules (coordinator/entities/config_flow)
; get rewritten against ha-nanit's plumbing during the port, and typing them
; here would require installing homeassistant just to lint.

[mypy]
python_version = 3.13
strict = True
files = custom_components/nanit_sound_light/api.py

; Ancestor package __init__ and the HA-facing modules: parsed, not enforced.
[mypy-nanit_sound_light,nanit_sound_light.coordinator,nanit_sound_light.entity,nanit_sound_light.light,nanit_sound_light.switch,nanit_sound_light.select,nanit_sound_light.number,nanit_sound_light.sensor,nanit_sound_light.binary_sensor,nanit_sound_light.config_flow]
ignore_errors = True

; Generated protobuf module: no static attributes (protoc builds the classes
; at import time), so let it be Any rather than generating stubs.
[mypy-nanit_sound_light.sound_light_pb2]
follow_imports = skip
ignore_missing_imports = True

[mypy-homeassistant.*]
ignore_missing_imports = True

[mypy-voluptuous.*]
ignore_missing_imports = True
